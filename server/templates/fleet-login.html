<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fleet Dashboard Login — Travony</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 100%);
      padding: 20px;
    }
    .card {
      background: white; border-radius: 20px; padding: 40px;
      width: 100%; max-width: 420px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
    .brand-dot {
      width: 42px; height: 42px; background: #00B14F; border-radius: 12px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .brand h1 { font-size: 22px; font-weight: 700; color: #1a202c; }
    .brand p { font-size: 12px; color: #64748b; margin-top: 2px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px; }
    .form-group input {
      width: 100%; padding: 12px 14px;
      border: 1.5px solid #e2e8f0; border-radius: 10px;
      font-size: 15px; outline: none; transition: border-color 0.2s;
      font-family: inherit;
    }
    .form-group input:focus { border-color: #00B14F; }
    .error-box {
      background: #fef2f2; color: #ef4444; border-radius: 8px;
      padding: 12px 14px; font-size: 14px; margin-bottom: 16px; display: none;
    }
    .btn {
      width: 100%; padding: 13px; background: #00B14F; color: white;
      border: none; border-radius: 10px; font-size: 15px; font-weight: 600;
      cursor: pointer; font-family: inherit; transition: background 0.2s;
    }
    .btn:hover { background: #009940; }
    .btn:disabled { opacity: 0.7; cursor: not-allowed; }
    .note { margin-top: 16px; font-size: 13px; color: #94a3b8; text-align: center; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="brand-dot">
        <svg width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="white" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/>
        </svg>
      </div>
      <div>
        <h1>Travony</h1>
        <p>Fleet &amp; Hub Dashboard</p>
      </div>
    </div>

    <div class="error-box" id="error-box"></div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email" placeholder="fleet@example.com" autocomplete="email">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="Your password" autocomplete="current-password">
    </div>

    <button class="btn" id="login-btn" onclick="doLogin()">Sign In</button>
    <p class="note">Access restricted to fleet owners and administrators.</p>
  </div>

  <script>
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') doLogin();
    });

    // If already logged in, verify token is still valid before redirecting
    (async function checkExistingSession() {
      const existingToken = localStorage.getItem('fleet_token');
      if (!existingToken || existingToken === 'undefined') return;
      try {
        const r = await fetch('/api/fleet/dashboard/hubs', {
          headers: { 'Authorization': 'Bearer ' + existingToken },
        });
        if (r.ok) {
          window.location.href = '/dashboard/fleet';
        } else {
          // Token invalid or expired — clear it and stay on login page
          localStorage.removeItem('fleet_token');
          localStorage.removeItem('fleet_user');
        }
      } catch (e) {
        // Network error — stay on login page, don't clear token
      }
    })();

    async function doLogin() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errBox = document.getElementById('error-box');
      const btn = document.getElementById('login-btn');

      errBox.style.display = 'none';
      btn.textContent = 'Signing in...';
      btn.disabled = true;

      try {
        const r = await fetch('/api/fleet/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ email, password }),
        });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || 'Login failed');

        // Store token for API calls and user info for display
        localStorage.setItem('fleet_token', data.token);
        localStorage.setItem('fleet_user', JSON.stringify(data.user));

        window.location.href = '/dashboard/fleet';
      } catch (e) {
        errBox.textContent = e.message;
        errBox.style.display = 'block';
        btn.textContent = 'Sign In';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
