<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Travony — Dealer Ladder Claims</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0b0f14; color: #e8edf2; min-height: 100vh; padding: 24px;
    }
    .wrap { max-width: 960px; margin: 0 auto; }
    h1 { font-size: 22px; font-weight: 600; }
    .sub { color: #8b98a5; font-size: 13px; margin-top: 4px; }
    .hidden { display: none; }
    .login {
      max-width: 360px; margin: 12vh auto 0; background: #121820;
      border: 1px solid #1f2933; border-radius: 12px; padding: 28px;
    }
    .login h2 { margin: 0 0 18px; font-size: 20px; }
    .login input {
      width: 100%; padding: 11px 12px; margin-bottom: 12px; border-radius: 8px;
      border: 1px solid #2a3642; background: #0b0f14; color: #e8edf2; font-size: 14px;
    }
    button {
      background: #12b981; color: #04110b; border: 0; border-radius: 8px;
      padding: 10px 16px; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: default; }
    button.ghost { background: transparent; color: #8b98a5; border: 1px solid #2a3642; }
    .error { color: #f87171; font-size: 13px; margin-top: 8px; min-height: 16px; }
    .bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; gap: 12px; flex-wrap: wrap; }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; margin-bottom: 26px; }
    .card { background: #121820; border: 1px solid #1f2933; border-radius: 10px; padding: 14px 16px; }
    .card .v { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .card .k { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: #8b98a5; margin-top: 4px; }
    .claim {
      background: #121820; border: 1px solid #1f2933; border-radius: 12px;
      padding: 16px 18px; margin-bottom: 12px; display: flex; gap: 16px;
      justify-content: space-between; align-items: flex-start; flex-wrap: wrap;
    }
    .claim .veh { font-size: 16px; font-weight: 600; }
    .claim .meta { color: #8b98a5; font-size: 13px; margin-top: 4px; line-height: 1.6; }
    .badge {
      display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; padding: 3px 10px; border-radius: 99px;
    }
    .badge.claimed { background: rgba(250, 204, 21, 0.14); color: #facc15; }
    .badge.fulfilled { background: rgba(18, 185, 129, 0.14); color: #12b981; }
    .act { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
    .act input {
      width: 220px; padding: 8px 10px; border-radius: 8px; border: 1px solid #2a3642;
      background: #0b0f14; color: #e8edf2; font-size: 13px;
    }
    .empty { color: #8b98a5; padding: 32px 0; text-align: center; }
  </style>
</head>
<body>
  <div id="login" class="login hidden">
    <h2>Dealer Ladder Access</h2>
    <input id="email" type="email" placeholder="Admin email" autocomplete="username" />
    <input id="password" type="password" placeholder="Password" autocomplete="current-password" />
    <button id="loginBtn">Sign in</button>
    <div id="loginError" class="error"></div>
  </div>

  <div id="dash" class="wrap hidden">
    <div class="bar">
      <div>
        <h1>Car Ladder — Dealer Claims</h1>
        <div class="sub">Drivers who have qualified and claimed their next vehicle. Fulfill a claim once the vehicle is handed over.</div>
      </div>
      <div style="display:flex; gap:8px;">
        <button id="refreshBtn" class="ghost">Refresh</button>
        <button id="logoutBtn" class="ghost">Sign out</button>
      </div>
    </div>

    <div class="cards" id="liability"></div>

    <div id="claims"><div class="empty">Loading claims…</div></div>
  </div>

  <script>
    let authToken = localStorage.getItem('adminToken');
    const $ = (id) => document.getElementById(id);
    const show = (id) => $(id).classList.remove('hidden');
    const hide = (id) => $(id).classList.add('hidden');
    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    function logout() {
      localStorage.removeItem('adminToken');
      authToken = null;
      hide('dash'); show('login');
    }

    async function api(path, opts) {
      const res = await fetch(path, Object.assign({}, opts, {
        headers: Object.assign({ 'Authorization': 'Bearer ' + authToken, 'Content-Type': 'application/json' }, (opts && opts.headers) || {}),
      }));
      if (res.status === 401 || res.status === 403) { logout(); throw new Error('Signed out'); }
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.message || 'Request failed');
      return data;
    }

    function renderLiability(l) {
      const cards = [
        [l.outstanding.goals, 'Open goals'],
        [l.fulfilled.goals, 'Fulfilled goals'],
        [l.savePercent + '%', 'Save rate'],
        [l.accrualPaused ? 'Paused' : 'Running', 'Accrual status'],
      ];
      $('liability').innerHTML = cards.map(function (c) {
        return '<div class="card"><div class="v">' + esc(c[0]) + '</div><div class="k">' + esc(c[1]) + '</div></div>';
      }).join('');
    }

    function renderClaims(rows) {
      const wrap = $('claims');
      if (!rows.length) {
        wrap.innerHTML = '<div class="empty">No claims yet. When a driver qualifies and claims a vehicle, it appears here.</div>';
        return;
      }
      wrap.innerHTML = '';
      rows.forEach(function (r) {
        const el = document.createElement('div');
        el.className = 'claim';
        const when = r.claimedAt ? new Date(r.claimedAt).toLocaleString() : '—';
        const done = r.fulfilledAt ? new Date(r.fulfilledAt).toLocaleString() : null;
        el.innerHTML =
          '<div>' +
            '<div class="veh">' + esc(r.vehicle.name) + ' <span class="badge ' + esc(r.status) + '">' + esc(r.status) + '</span></div>' +
            '<div class="meta">' +
              esc(r.vehicle.kind) + ' · Tier ' + esc(r.vehicle.tier) + ' · ' + esc(r.vehicle.currency) + ' ' + Number(r.vehicle.priceLocal).toLocaleString() + ' · Region ' + esc(r.vehicle.region) + '<br/>' +
              'Driver: ' + esc(r.driverStats.driverId) + ' · Trips: ' + esc(r.driverStats.totalTrips) + '<br/>' +
              'Claimed: ' + esc(when) + (done ? ' · Fulfilled: ' + esc(done) : '') +
              (r.dealerNote ? '<br/>Note: ' + esc(r.dealerNote) : '') +
            '</div>' +
          '</div>';
        if (r.status === 'claimed') {
          const act = document.createElement('div');
          act.className = 'act';
          const note = document.createElement('input');
          note.placeholder = 'Handover note (optional)';
          const btn = document.createElement('button');
          btn.textContent = 'Mark fulfilled';
          btn.addEventListener('click', async function () {
            btn.disabled = true;
            try {
              await api('/api/ladder/dealer/claims/' + encodeURIComponent(r.goalId) + '/fulfill', {
                method: 'POST',
                body: JSON.stringify({ note: note.value || undefined }),
              });
              load();
            } catch (err) {
              alert(err.message);
              btn.disabled = false;
            }
          });
          act.appendChild(note);
          act.appendChild(btn);
          el.appendChild(act);
        }
        wrap.appendChild(el);
      });
    }

    async function load() {
      try {
        const liability = await api('/api/ladder/admin/liability');
        renderLiability(liability);
        const claims = await api('/api/ladder/dealer/claims');
        renderClaims(Array.isArray(claims) ? claims : (claims.claims || []));
      } catch (err) {
        if (authToken) $('claims').innerHTML = '<div class="empty">' + esc(err.message) + '</div>';
      }
    }

    function showDashboard() { hide('login'); show('dash'); load(); }

    $('loginBtn').addEventListener('click', async function () {
      const errorDiv = $('loginError');
      errorDiv.textContent = '';
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: $('email').value, password: $('password').value }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Login failed');
        if (!data.user || data.user.role !== 'admin') throw new Error('Admin account required.');
        authToken = data.token;
        localStorage.setItem('adminToken', authToken);
        showDashboard();
      } catch (err) {
        errorDiv.textContent = err.message;
      }
    });
    $('password').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('loginBtn').click(); });
    $('refreshBtn').addEventListener('click', load);
    $('logoutBtn').addEventListener('click', logout);

    if (authToken) showDashboard(); else show('login');
  </script>
</body>
</html>
