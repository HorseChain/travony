<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Travony — System Wiring Health</title>
  <style>
    :root {
      --bg: #0b1020;
      --card: #151b2e;
      --card-2: #1b2238;
      --text: #e8ecf6;
      --muted: #93a0bd;
      --ok: #2ecc71;
      --warn: #f4b740;
      --down: #ff5d5d;
      --border: #26304b;
      --accent: #5b8cff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 880px; margin: 0 auto; padding: 28px 20px 60px; }
    header h1 { font-size: 24px; margin: 0 0 4px; }
    header p { color: var(--muted); margin: 0 0 24px; font-size: 14px; }
    .overall {
      display: flex; align-items: center; gap: 14px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 16px; padding: 18px 20px; margin-bottom: 22px;
    }
    .dot { width: 14px; height: 14px; border-radius: 50%; flex: none; }
    .dot.ok { background: var(--ok); box-shadow: 0 0 12px var(--ok); }
    .dot.warn { background: var(--warn); box-shadow: 0 0 12px var(--warn); }
    .dot.down { background: var(--down); box-shadow: 0 0 12px var(--down); }
    .overall .label { font-size: 18px; font-weight: 600; }
    .overall .sub { color: var(--muted); font-size: 13px; }
    .grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
    @media (min-width: 620px) { .grid { grid-template-columns: 1fr 1fr; } }
    .check {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; padding: 16px;
      display: flex; gap: 12px; align-items: flex-start;
    }
    .check .name { font-weight: 600; font-size: 15px; }
    .check .cat { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .6px; margin-top: 2px; }
    .check .detail { color: var(--muted); font-size: 13px; margin-top: 6px; line-height: 1.4; }
    .badge { margin-left: auto; font-size: 11px; font-weight: 700; padding: 4px 9px; border-radius: 999px; text-transform: uppercase; }
    .badge.ok { background: rgba(46,204,113,.15); color: var(--ok); }
    .badge.warn { background: rgba(244,183,64,.15); color: var(--warn); }
    .badge.down { background: rgba(255,93,93,.15); color: var(--down); }
    .bar { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
    button {
      background: var(--accent); color: #fff; border: none; border-radius: 10px;
      padding: 10px 16px; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    button.secondary { background: var(--card-2); color: var(--text); border: 1px solid var(--border); }
    button:disabled { opacity: .6; cursor: default; }
    .updated { color: var(--muted); font-size: 12px; margin-left: auto; }
    /* Login */
    .login {
      max-width: 380px; margin: 80px auto; background: var(--card);
      border: 1px solid var(--border); border-radius: 16px; padding: 28px;
    }
    .login h2 { margin: 0 0 18px; font-size: 20px; }
    .login input {
      width: 100%; padding: 11px 13px; margin-bottom: 12px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 14px;
    }
    .login button { width: 100%; }
    .error { color: var(--down); font-size: 13px; margin-top: 6px; min-height: 18px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <!-- Login -->
  <div id="login" class="login hidden">
    <h2>Admin sign in</h2>
    <input id="email" type="email" placeholder="Email" autocomplete="username" />
    <input id="password" type="password" placeholder="Password" autocomplete="current-password" />
    <button id="loginBtn">Sign in</button>
    <div id="loginError" class="error"></div>
  </div>

  <!-- Dashboard -->
  <div id="dash" class="wrap hidden">
    <header>
      <h1>System Wiring Health</h1>
      <p>Live status of the services that keep Travony connected.</p>
    </header>

    <div class="overall">
      <span id="overallDot" class="dot ok"></span>
      <div>
        <div id="overallLabel" class="label">Checking…</div>
        <div id="overallSub" class="sub">Running checks across all services.</div>
      </div>
    </div>

    <div class="bar">
      <button id="refreshBtn" onclick="loadHealth()">Refresh</button>
      <button class="secondary" onclick="logout()">Sign out</button>
      <span id="updated" class="updated"></span>
    </div>

    <div id="grid" class="grid"></div>
  </div>

  <script>
    let authToken = localStorage.getItem('adminToken') || localStorage.getItem('authToken');

    function show(id) { document.getElementById(id).classList.remove('hidden'); }
    function hide(id) { document.getElementById(id).classList.add('hidden'); }

    function labelFor(status) {
      return status === 'ok' ? 'Connected' : status === 'warn' ? 'Needs attention' : 'Down';
    }

    function render(health) {
      const dot = document.getElementById('overallDot');
      dot.className = 'dot ' + health.overall;
      document.getElementById('overallLabel').textContent =
        health.overall === 'ok' ? 'All systems connected'
        : health.overall === 'warn' ? 'Some services need attention'
        : 'A core service is down';
      const counts = health.checks.reduce((a, c) => { a[c.status] = (a[c.status] || 0) + 1; return a; }, {});
      document.getElementById('overallSub').textContent =
        `${counts.ok || 0} connected · ${counts.warn || 0} need attention · ${counts.down || 0} down`;

      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      health.checks.forEach(c => {
        const el = document.createElement('div');
        el.className = 'check';
        el.innerHTML = `
          <span class="dot ${c.status}" style="margin-top:5px"></span>
          <div style="flex:1">
            <div class="name">${c.name}</div>
            <div class="cat">${c.category}</div>
            <div class="detail">${c.detail}</div>
          </div>
          <span class="badge ${c.status}">${labelFor(c.status)}</span>`;
        grid.appendChild(el);
      });

      document.getElementById('updated').textContent =
        'Updated ' + new Date(health.generatedAt).toLocaleTimeString();
    }

    async function loadHealth() {
      const btn = document.getElementById('refreshBtn');
      btn.disabled = true; btn.textContent = 'Checking…';
      try {
        const res = await fetch('/api/admin/health', {
          headers: { 'Authorization': `Bearer ${authToken}` },
        });
        if (res.status === 401 || res.status === 403) { logout(); return; }
        if (!res.ok) throw new Error('Failed to load health');
        render(await res.json());
      } catch (err) {
        document.getElementById('overallLabel').textContent = 'Could not load status';
        document.getElementById('overallSub').textContent = err.message;
      } finally {
        btn.disabled = false; btn.textContent = 'Refresh';
      }
    }

    function showDashboard() {
      hide('login'); show('dash'); loadHealth();
    }

    function logout() {
      localStorage.removeItem('adminToken');
      authToken = null;
      hide('dash'); show('login');
    }

    document.getElementById('loginBtn').addEventListener('click', async () => {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('loginError');
      errorDiv.textContent = '';
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Login failed');
        if (!data.user || data.user.role !== 'admin') throw new Error('Admin account required.');
        authToken = data.token;
        localStorage.setItem('adminToken', authToken);
        showDashboard();
      } catch (err) {
        errorDiv.textContent = err.message;
      }
    });

    if (authToken) { showDashboard(); } else { show('login'); }
  </script>
</body>
</html>
